name: One-shot Creative Job List Density

on:
  push:
    branches:
      - fix/creative-job-list-density-requester
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      ALYSSA_E2E_FIXTURES: 1
      E2E_ADMIN_PASSWORD: playwright-ci-password
      E2E_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/creative-job-list-density-requester
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply compact Job List implementation
        run: python3 scripts/implement-creative-job-list-density.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build and contracts
        run: npm run build

      - name: Build Storybook
        run: npm run build:storybook

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Refresh deterministic Creative Production baselines
        run: npx playwright test e2e/creative-production.spec.ts --update-snapshots

      - name: Verify Creative Production interactions and density
        run: npx playwright test e2e/creative-production.spec.ts

      - name: Verify design quality
        run: npm run test:design

      - name: Verify full product regression
        run: npm run test:e2e

      - name: Commit verified implementation and remove one-shot files
        shell: bash
        run: |
          rm .github/workflows/one-shot-creative-job-list-density.yml
          rm scripts/implement-creative-job-list-density.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git status --short
          git commit -m "Compact Creative Job list and show creator"
          git push origin HEAD:fix/creative-job-list-density-requester
