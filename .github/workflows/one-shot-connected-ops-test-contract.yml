name: One-shot connected ops test contract patch
on:
  push:
    branches:
      - agent/connected-marketing-ops-v1
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connected-marketing-ops-v1
      - name: Update intentional UI contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('e2e/marketing-command-center.spec.ts')
          text = p.read_text()
          old = '每日 Lead走勢；橙色圓點代表日曆操作'
          new = '每日 Lead走勢；橙色圓點代表已連結嘅成效事件'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 old annotation labels, found {count}')
          p.write_text(text.replace(old, new))

          s = Path('e2e/settings-management.spec.ts')
          text = s.read_text()
          old_count = 'await expect(primaryNavLinks).toHaveCount(13);'
          if text.count(old_count) != 1:
              raise SystemExit('expected one 13-link nav assertion')
          s.write_text(text.replace(old_count, 'await expect(primaryNavLinks).toHaveCount(14);'))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-connected-ops-test-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- e2e/marketing-command-center.spec.ts e2e/settings-management.spec.ts .github/workflows/one-shot-connected-ops-test-contract.yml
          git commit -m "Align regression tests with connected operations UI"
          git push origin HEAD:agent/connected-marketing-ops-v1
