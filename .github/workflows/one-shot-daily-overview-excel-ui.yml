name: One-shot Daily Overview Excel UI patch

on:
  push:
    branches:
      - agent/daily-overview-excel-export

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-overview-excel-export
      - name: Patch Daily Overview UI
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/performance/daily/page.tsx')
          text = path.read_text()

          old = '''  DatabaseZap,\n  Info,'''
          new = '''  DatabaseZap,\n  FileSpreadsheet,\n  Info,'''
          assert text.count(old) == 1, 'icon import anchor mismatch'
          text = text.replace(old, new)

          old = '''  const returnPath = `/performance/daily?${returnParams.toString()}`;\n  const tableBrands ='''
          new = '''  const returnPath = `/performance/daily?${returnParams.toString()}`;\n  const exportParams = new URLSearchParams({ month: snapshot.monthStart });\n  if (snapshot.selectedBrandScope) {\n    exportParams.set("brand", snapshot.selectedBrandScope);\n  }\n  const exportHref = `/api/internal/daily-overview/export?${exportParams.toString()}`;\n  const tableBrands ='''
          assert text.count(old) == 1, 'export href anchor mismatch'
          text = text.replace(old, new)

          old = '''              <SubmitButton\n                className="command-secondary-button"\n                pendingLabel="載入中…"\n              >\n                <CalendarDays size={15} />\n                查看數據\n              </SubmitButton>\n            </form>'''
          new = '''              <SubmitButton\n                className="command-secondary-button"\n                pendingLabel="載入中…"\n              >\n                <CalendarDays size={15} />\n                查看數據\n              </SubmitButton>\n              <a\n                data-testid="daily-overview-excel-export"\n                href={exportHref}\n                className="command-primary-button"\n              >\n                <FileSpreadsheet size={15} />\n                匯出 Excel\n              </a>\n            </form>'''
          assert text.count(old) == 1, 'filter action anchor mismatch'
          text = text.replace(old, new)
          path.write_text(text)

          workflow = Path('.github/workflows/one-shot-daily-overview-excel-ui.yml')
          workflow.unlink()
          PY
          git diff --check
          git status --short
      - name: Commit UI patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/performance/daily/page.tsx .github/workflows/one-shot-daily-overview-excel-ui.yml
          git commit -m "Add Daily Overview Excel export action [skip ci]"
          git push origin HEAD:agent/daily-overview-excel-export
