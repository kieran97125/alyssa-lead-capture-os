name: One-shot Creative Job Delete Discoverability

on:
  push:
    branches:
      - fix/creative-job-delete-discoverability

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      ALYSSA_E2E_FIXTURES: "1"
      E2E_ADMIN_PASSWORD: playwright-ci-password
      E2E_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""

    steps:
      - name: Checkout delete UX branch
        uses: actions/checkout@v4
        with:
          ref: fix/creative-job-delete-discoverability
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply visible delete controls
        run: python3 scripts/apply-creative-job-delete-discoverability.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build and contracts
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Creative Studio interactions
        run: npm run test:creative

      - name: Verify full application regression
        run: npm run test:e2e

      - name: Commit verified delete UX
        shell: bash
        run: |
          rm -f scripts/apply-creative-job-delete-discoverability.py
          rm -f .github/workflows/one-shot-creative-job-delete-discoverability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git status --short
          git commit -m "Expose safe Creative Job deletion"
          git push origin HEAD:fix/creative-job-delete-discoverability
