name: Sync Supabase Auth Email Templates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/templates/invite.html"
      - "supabase/templates/magic-link.html"

permissions:
  contents: read

concurrency:
  group: supabase-auth-email-template-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync and verify hosted templates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync Invite and Magic Link templates
        run: npm run sync:auth-email-templates
