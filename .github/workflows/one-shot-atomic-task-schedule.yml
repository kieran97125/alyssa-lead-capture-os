name: One-shot atomic Task schedule integration

on:
  push:
    branches:
      - agent/task-start-date-web-push
    paths:
      - .github/workflows/one-shot-atomic-task-schedule.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CI: true
      E2E_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/task-start-date-web-push
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch Server Action to atomic RPC
        run: python3 scripts/one-shot-atomic-task-schedule.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified atomic integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/app/tasks/actions.ts
          git rm -- \
            scripts/one-shot-atomic-task-schedule.py \
            .github/workflows/one-shot-atomic-task-schedule.yml
          git commit -m "Make Task and Calendar schedule updates atomic"
          git push origin HEAD:agent/task-start-date-web-push
