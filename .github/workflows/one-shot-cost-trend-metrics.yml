name: One-shot CPLead CPBook CPShow Trends

on:
  push:
    branches:
      - feat/cost-per-funnel-trends

permissions:
  contents: write

concurrency:
  group: cost-per-funnel-trends
  cancel-in-progress: false

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: true
      ALYSSA_E2E_FIXTURES: 1
      E2E_ADMIN_PASSWORD: playwright-ci-password
      E2E_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ''
      SUPABASE_SERVICE_ROLE_KEY: ''

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/cost-per-funnel-trends
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply cost trend implementation and acceptance alignment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/implement-cost-trend-metrics.py")
          text = path.read_text(encoding="utf-8")
          old = '''path = "src/lib/marketing/leadDashboard.ts"
          replace_all(
              path,
              "      annotations,\\n    }),",
              "      annotations,\\n      spendFacts,\\n      costAttributable: !filters.treatment,\\n    }),",
              minimum=2,
          )
          '''
          new = '''path = "src/lib/marketing/leadDashboard.ts"
          replace_exact(
              path,
              "      annotations,\\n    }),",
              "      annotations,\\n      spendFacts,\\n      costAttributable: !filters.treatment,\\n    }),",
          )
          replace_exact(
              path,
              "        annotations,\\n      }),",
              "        annotations,\\n        spendFacts,\\n        costAttributable: !filters.treatment,\\n      }),",
          )
          '''
          if old not in text:
              raise SystemExit("Lead Dashboard cost-trend patch block not found")
          patched = text.replace(old, new).replace(
              "只顯示已記錄嘅品牌成本；",
              "只顯示已記錄嘅品牌廣告費；",
          )
          path.write_text(patched, encoding="utf-8")
          PY
          python3 scripts/implement-cost-trend-metrics.py
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {actual}: {old[:100]!r}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          def replace_all(path: str, old: str, new: str, minimum: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} occurrence(s), found {actual}: {old[:100]!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          # Exact accessible names prevent Lead controls colliding with CPLead.
          replace_all(
              "e2e/connected-marketing-ops.spec.ts",
              'card.getByRole("button", { name: "Lead" }).click();',
              'card.getByRole("button", { name: "Lead", exact: true }).click();',
              minimum=2,
          )

          # Period Comparison now uses the same compact CP naming as other trend surfaces.
          replace_exact(
              "e2e/marketing-command-center.spec.ts",
              'const showCostTrend = page.getByRole("button", {\n    name: "CPA · Show",',
              'const showCostTrend = page.getByRole("button", {\n    name: "CPShow",',
          )

          # Canonical comparison fixtures explicitly declare that their spend rows exist.
          for amount in (100, 300, 200):
              replace_exact(
                  "e2e/marketing-command-center.spec.ts",
                  f"      spend: {amount},\\n      leads:",
                  f"      spend: {amount},\\n      spendRecorded: true,\\n      leads:",
              )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build and contracts
        run: npm run build

      - name: Build Storybook
        run: npm run build:storybook

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Create deterministic cost trend baselines
        run: npx playwright test e2e/performance-cost-trends.spec.ts --update-snapshots

      - name: Verify cost trends and existing daily cumulative behavior
        run: npx playwright test e2e/connected-marketing-ops.spec.ts e2e/performance-cost-trends.spec.ts e2e/marketing-command-center.spec.ts

      - name: Verify design quality
        run: npm run test:design

      - name: Verify full product regression
        run: npm run test:e2e

      - name: Commit verified implementation and remove one-shot files
        shell: bash
        run: |
          rm .github/workflows/one-shot-cost-trend-metrics.yml
          rm scripts/implement-cost-trend-metrics.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git status --short
          git commit -m "Add CPLead CPBook and CPShow performance trends"
          git push origin HEAD:feat/cost-per-funnel-trends
