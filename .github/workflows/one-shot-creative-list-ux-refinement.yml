name: One-shot Creative Jobs UX Refinement

on:
  push:
    branches:
      - feat/creative-list-ux-refinement

permissions:
  contents: write

jobs:
  refine-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      ALYSSA_E2E_FIXTURES: "1"
      E2E_ADMIN_PASSWORD: playwright-ci-password
      E2E_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""

    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v4
        with:
          ref: feat/creative-list-ux-refinement
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stabilize generated UX acceptance source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/creative-list-ux-refinement.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace("用途／格式", "用途／媒體格式")

          first_marker = (
              '              const sidebar = page.locator(".command-sidebar");\n'
              '              const before = await sidebar.evaluate((element) => element.clientWidth);\n'
          )
          first_replacement = (
              '              const sidebar = page.locator(".command-sidebar");\n'
              '              const collapseButton = page.getByRole("button", {\n'
              '                name: "收起主功能欄",\n'
              '              });\n'
              '              await expect(collapseButton).toBeVisible();\n'
              '              await page.waitForFunction(() => {\n'
              '                const element = document.querySelector(".command-sidebar");\n'
              '                return element instanceof HTMLElement && element.clientWidth > 200;\n'
              '              });\n'
              '              const before = await sidebar.evaluate((element) => element.clientWidth);\n'
          )
          if first_marker not in source:
              raise SystemExit("Sidebar initial-width acceptance marker missing")
          source = source.replace(first_marker, first_replacement, 1)

          collapse_marker = (
              '              await page.getByRole("button", { name: "收起主功能欄" }).click();\n'
          )
          if collapse_marker not in source:
              raise SystemExit("Sidebar collapse click marker missing")
          source = source.replace(
              collapse_marker,
              '              await collapseButton.click();\n',
              1,
          )

          collapsed_marker = (
              '              await expect(page.getByRole("button", { name: "展開主功能欄" })).toBeVisible();\n'
              '              const after = await sidebar.evaluate((element) => element.clientWidth);\n'
          )
          collapsed_replacement = (
              '              await expect(page.getByRole("button", { name: "展開主功能欄" })).toBeVisible();\n'
              '              await page.waitForFunction(() => {\n'
              '                const element = document.querySelector(".command-sidebar");\n'
              '                return element instanceof HTMLElement && element.clientWidth < 100;\n'
              '              });\n'
              '              const after = await sidebar.evaluate((element) => element.clientWidth);\n'
          )
          if collapsed_marker not in source:
              raise SystemExit("Sidebar collapsed-width acceptance marker missing")
          source = source.replace(collapsed_marker, collapsed_replacement, 1)

          restored_marker = (
              '              await expect(page.locator("html")).not.toHaveClass(/command-sidebar-collapsed/);\n'
          )
          restored_replacement = (
              '              await expect(page.locator("html")).not.toHaveClass(/command-sidebar-collapsed/);\n'
              '              await page.waitForFunction(() => {\n'
              '                const element = document.querySelector(".command-sidebar");\n'
              '                return element instanceof HTMLElement && element.clientWidth > 200;\n'
              '              });\n'
          )
          if restored_marker not in source:
              raise SystemExit("Sidebar restored-width acceptance marker missing")
          source = source.replace(restored_marker, restored_replacement, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Apply production UX refinement
        run: python3 scripts/run-creative-list-ux-refinement.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build and contracts
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Creative Jobs interactions
        run: npm run test:creative

      - name: Refresh intentional visual baselines
        run: npm run test:design:update

      - name: Verify full application regression
        run: npm run test:e2e

      - name: Commit verified refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          targets = [
              "src/app/creative-jobs/actions.ts",
              "src/app/creative-jobs/page.tsx",
              "src/components/alyssa/AppNavClient.tsx",
              "src/components/alyssa/AppNavClient.module.css",
              "src/components/creative/CreativeJobHeaderActions.tsx",
              "src/components/creative/CreativeJobHeaderActions.module.css",
              "src/components/creative/CreativeProductionFixture.tsx",
              "e2e/creative-production.spec.ts",
              "scripts/verify-creative-production-contract.mjs",
          ]
          for target in targets:
              path = Path(target)
              if not path.exists():
                  continue
              path.write_text(
                  path.read_text(encoding="utf-8").rstrip() + "\n",
                  encoding="utf-8",
              )
          PY
          git add --all
          git diff --cached --check
          git status --short
          git commit -m "Refine Creative Jobs list and navigation UX"
          git push origin HEAD:feat/creative-list-ux-refinement
