name: One-shot Creative Jobs UX Refinement

on:
  push:
    branches:
      - feat/creative-list-ux-refinement

permissions:
  contents: write

jobs:
  refine-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      ALYSSA_E2E_FIXTURES: "1"
      E2E_ADMIN_PASSWORD: playwright-ci-password
      E2E_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""

    steps:
      - name: Checkout refinement branch
        uses: actions/checkout@v4
        with:
          ref: feat/creative-list-ux-refinement
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Stabilize generated UX acceptance source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/creative-list-ux-refinement.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace("用途／格式", "用途／媒體格式")

          old = '''              const sidebar = page.locator(".command-sidebar");
              const before = await sidebar.evaluate((element) => element.clientWidth);
              await page.getByRole("button", { name: "收起主功能欄" }).click();
              await expect(page.locator("html")).toHaveClass(/command-sidebar-collapsed/);
              await expect(page.getByRole("button", { name: "展開主功能欄" })).toBeVisible();
              const after = await sidebar.evaluate((element) => element.clientWidth);
              expect(after).toBeLessThan(before);

              await page.getByRole("button", { name: "展開主功能欄" }).click();
              await expect(page.locator("html")).not.toHaveClass(/command-sidebar-collapsed/);'''
          new = '''              const sidebar = page.locator(".command-sidebar");
              const collapseButton = page.getByRole("button", {
                name: "收起主功能欄",
              });
              await expect(collapseButton).toBeVisible();
              await page.waitForFunction(() => {
                const element = document.querySelector(".command-sidebar");
                return element instanceof HTMLElement && element.clientWidth > 200;
              });
              const before = await sidebar.evaluate((element) => element.clientWidth);

              await collapseButton.click();
              await expect(page.locator("html")).toHaveClass(/command-sidebar-collapsed/);
              await expect(page.getByRole("button", { name: "展開主功能欄" })).toBeVisible();
              await page.waitForFunction(() => {
                const element = document.querySelector(".command-sidebar");
                return element instanceof HTMLElement && element.clientWidth < 100;
              });
              const after = await sidebar.evaluate((element) => element.clientWidth);
              expect(after).toBeLessThan(before);

              await page.getByRole("button", { name: "展開主功能欄" }).click();
              await expect(page.locator("html")).not.toHaveClass(/command-sidebar-collapsed/);
              await page.waitForFunction(() => {
                const element = document.querySelector(".command-sidebar");
                return element instanceof HTMLElement && element.clientWidth > 200;
              });'''
          if old not in source:
              raise SystemExit("Sidebar acceptance source marker missing")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Apply production UX refinement
        run: python3 scripts/run-creative-list-ux-refinement.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build and contracts
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Creative Jobs interactions
        run: npm run test:creative

      - name: Refresh intentional visual baselines
        run: npm run test:design:update

      - name: Verify full application regression
        run: npm run test:e2e

      - name: Commit verified refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git status --short
          git commit -m "Refine Creative Jobs list and navigation UX"
          git push origin HEAD:feat/creative-list-ux-refinement
