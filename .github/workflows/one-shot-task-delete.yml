name: One-shot task delete patch
on:
  push:
    branches:
      - agent/monday-task-delete
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/monday-task-delete
      - name: Patch task delete
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('src/app/tasks/actions.ts')
          s = p.read_text()
          anchor = 'export async function assignWorkTaskAction(formData: FormData) {'
          block = '''export async function deleteWorkTaskAction(formData: FormData) {
  const returnPath = safeReturnPath(readString(formData, "returnPath"));
  const access = await requireTaskOperator(returnPath);
  const taskId = readString(formData, "taskId");
  if (!taskId) redirectResult(returnPath, false, "缺少要刪除嘅工作資料。" );
  const taskResult = await getAccessibleTask(taskId, access);
  if (taskResult.error || !taskResult.data || !canAccessInternalBrand(access, taskResult.data.brand_id)) {
    redirectResult(returnPath, false, "你未獲授權刪除呢項工作。" );
  }
  const supabase = createSupabaseAdminClient();
  const { error } = await supabase.from("marketing_work_tasks").delete().eq("id", taskId);
  if (error) {
    console.warn("marketing_work_task_delete_failed", { code: error.code });
    redirectResult(returnPath, false, "刪除工作失敗，請稍後再試。" );
  }
  revalidateOps();
  redirectResult(returnPath, true, `已刪除工作：${taskResult.data.title}`);
}

'''
          assert s.count(anchor) == 1
          p.write_text(s.replace(anchor, block + anchor))

          p = Path('src/app/tasks/page.tsx')
          s = p.read_text()
          s = s.replace('  Sparkles,\n  UserRound,', '  Sparkles,\n  Trash2,\n  UserRound,')
          s = s.replace('  assignWorkTaskAction,\n  markWorkNotificationReadAction,', '  assignWorkTaskAction,\n  deleteWorkTaskAction,\n  markWorkNotificationReadAction,')
          s = s.replace('grid-cols-[minmax(260px,1.8fr)_150px_150px_130px_140px_90px_115px_76px]', 'grid-cols-[minmax(260px,1.8fr)_150px_150px_130px_140px_90px_115px_118px]')
          s = s.replace('>更新</span>', '>操作</span>', 1)
          old = '''        <div className="flex items-center justify-center border-l border-[#f0e7e2] px-2 py-2">
          <span className="inline-flex min-w-7 items-center justify-center rounded-full bg-[#fff4f8] px-2 py-1 text-[9px] font-black text-[#7c365f]">
            <MessageSquareText size={10} className="mr-1" />{task.comments.length}
          </span>
        </div>'''
          new = '''        <div className="flex items-center justify-center gap-1.5 border-l border-[#f0e7e2] px-2 py-2">
          <span className="inline-flex min-w-7 items-center justify-center rounded-full bg-[#fff4f8] px-2 py-1 text-[9px] font-black text-[#7c365f]" title="留言數">
            <MessageSquareText size={10} className="mr-1" />{task.comments.length}
          </span>
          <details className="relative" data-testid="task-delete-control">
            <summary className="list-none cursor-pointer rounded-lg bg-[#fff1f0] px-2 py-1.5 text-[9px] font-black text-[#a34c46]" aria-label={`刪除 ${task.title}`}>
              <Trash2 size={10} />
            </summary>
            <div className="absolute right-0 z-20 mt-1 w-40 rounded-xl border border-[#e8c8c4] bg-white p-2 shadow-[0_10px_30px_rgba(90,35,72,0.12)]">
              <p className="text-[10px] font-bold leading-4 text-[#6e505d]">確認刪除「{task.title}」？</p>
              <p className="mt-1 text-[9px] leading-4 text-[#9a7a8a]">只刪工作，唔會刪已連結嘅營銷日曆事項。</p>
              <form action={deleteWorkTaskAction} className="mt-2">
                <input type="hidden" name="taskId" value={task.id} />
                <input type="hidden" name="returnPath" value={returnPath} />
                <button className="w-full rounded-lg bg-[#a34c46] px-2 py-1.5 text-[9px] font-black text-white">確認刪除</button>
              </form>
            </div>
          </details>
        </div>'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))

          p = Path('e2e/connected-marketing-ops.spec.ts')
          s = p.read_text()
          anchor = '  await expect(firstTask.getByTestId("task-status-form").getByRole("button", { name: "更新" })).toBeVisible();\n'
          assert s.count(anchor) == 1
          p.write_text(s.replace(anchor, anchor + '  await expect(firstTask.getByTestId("task-delete-control")).toBeVisible();\n  await expect(firstTask.getByLabel(/刪除/)).toBeVisible();\n'))
          PY
      - name: Commit patch
        run: |
          rm .github/workflows/one-shot-task-delete.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/app/tasks/actions.ts src/app/tasks/page.tsx e2e/connected-marketing-ops.spec.ts .github/workflows/one-shot-task-delete.yml
          git commit -m "Add safe deletion to weekly tasks"
          git push origin HEAD:agent/monday-task-delete
