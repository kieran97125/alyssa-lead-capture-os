name: One-shot Creative Workspace Commit

on:
  push:
    branches:
      - fix/creative-job-list-density-requester
    paths:
      - .github/workflows/one-shot-creative-workspace-commit.yml

permissions:
  contents: write

concurrency:
  group: one-shot-creative-workspace-commit
  cancel-in-progress: false

jobs:
  implement-commit-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: true
      ALYSSA_E2E_FIXTURES: 1
      E2E_ADMIN_PASSWORD: playwright-ci-password
      E2E_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/creative-job-list-density-requester
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final Creative workspace implementation
        run: python3 scripts/implement-creative-workspace-finalize.py

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Align Creative Production contract with approved workspace IA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/verify-creative-production-contract.mjs')
          text = path.read_text()
          text = re.sub(
              r'\n?\s*assert\.match\(workspaceSource,\s*/插入 Workspace/\);',
              '',
              text,
              flags=re.S,
          )
          checks = '''\nassert.match(workspaceSource, /CreativeBriefHistoryDialog/);\nassert.doesNotMatch(workspaceSource, /activePanel === ["']assets["']/);\nassert.doesNotMatch(workspaceSource, /activePanel === ["']discussion["']/);\nassert.match(editorSource, /Brief 解釋圖/);\nassert.match(editorSource, /@tiptap\\/extension-text-style/);\nassert.match(editorSource, /unsetColor/);\n'''
          if 'assert.match(workspaceSource, /CreativeBriefHistoryDialog/);' not in text:
              index = text.rfind('console.log(')
              text = text[:index] + checks + text[index:] if index >= 0 else text + checks
          path.write_text(text)
          PY

      - name: Commit implementation so review and CI inspect the real branch
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-creative-workspace-finalize.yml
          rm -f .github/workflows/one-shot-creative-workspace-commit.yml
          rm -f scripts/implement-creative-workspace-finalize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git status --short
          git commit -m "Finalize Creative Job workspace and persistence"
          git push origin HEAD:fix/creative-job-list-density-requester

      - name: Install dependencies
        run: npm ci

      - name: Verify production build and contracts
        run: npm run build

      - name: Build Storybook
        run: npm run build:storybook

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Refresh deterministic Creative Production baselines
        run: npx playwright test e2e/creative-production.spec.ts --update-snapshots

      - name: Verify Creative Production interactions and workspace
        run: npx playwright test e2e/creative-production.spec.ts

      - name: Verify design quality
        run: npm run test:design

      - name: Verify full product regression
        run: npm run test:e2e
