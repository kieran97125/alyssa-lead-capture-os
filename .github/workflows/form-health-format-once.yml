name: Form health format once

on:
  push:
    branches:
      - agent/form-health-gos-booking-hours
    paths:
      - .github/workflows/form-health-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/form-health-gos-booking-hours
          fetch-depth: 0
      - name: Normalize hotfix indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/components/alyssa/PublicLeadForm.tsx")
          source = path.read_text()
          old = "    if (\n            !formData.appointment_time ||\n      standardBookingTimes.includes(formData.appointment_time)\n    ) {"
          new = "    if (\n      !formData.appointment_time ||\n      standardBookingTimes.includes(formData.appointment_time)\n    ) {"
          if source.count(old) != 1:
              raise RuntimeError(f"expected one indentation target, got {source.count(old)}")
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/components/alyssa/PublicLeadForm.tsx
      - name: Commit formatting fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/alyssa/PublicLeadForm.tsx
          git commit -m "Normalize GOS booking hotfix formatting [skip ci]"
          git push origin HEAD:agent/form-health-gos-booking-hours
