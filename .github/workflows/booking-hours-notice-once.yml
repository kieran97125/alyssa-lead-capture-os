name: Booking hours notice once

on:
  push:
    branches:
      - agent/hk-public-holiday-booking-hours
    paths:
      - .github/workflows/booking-hours-notice-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hk-public-holiday-booking-hours
          fetch-depth: 0
      - name: Patch public form notice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/alyssa/PublicLeadForm.tsx")
          source = path.read_text()

          replacements = [
              (
                  'import {\n  getPublicBookingTimeOptions,\n  type PublicBranchOpeningHours,\n} from "@/lib/booking/publicBookingTimes";',
                  'import {\n  getPublicBookingHoursNotice,\n  getPublicBookingTimeOptions,\n  type PublicBranchOpeningHours,\n} from "@/lib/booking/publicBookingTimes";',
                  'booking helper import',
              ),
              (
                  '  const legalProfile = useMemo(() => {',
                  '  const bookingHoursNotice = useMemo(\n    () => getPublicBookingHoursNotice(brand.slug || brandSlug),\n    [brand.slug, brandSlug]\n  );\n  const legalProfile = useMemo(() => {',
                  'booking notice memo',
              ),
              (
                  '                </div>\n\n                <label className="mt-4 flex items-start gap-2.5 text-[13px] font-semibold leading-5 text-[var(--public-heading)]">',
                  '                </div>\n\n                <p className="mt-2 text-[11px] font-semibold leading-4 text-[var(--public-muted)] sm:text-xs sm:leading-5">\n                  {bookingHoursNotice}\n                </p>\n\n                <label className="mt-4 flex items-start gap-2.5 text-[13px] font-semibold leading-5 text-[var(--public-heading)]">',
                  'compact booking notice',
              ),
              (
                  '                  </div>\n                </FormSection>\n\n                <section className="box-border w-full max-w-full rounded-[12px] border border-[#f3e5ec] bg-white p-2.5 sm:rounded-[18px] sm:border-[var(--public-border)] sm:bg-[var(--public-soft-bg)] sm:p-3">',
                  '                  </div>\n                  <p className="text-[11px] font-semibold leading-4 text-[var(--public-muted)] sm:text-xs sm:leading-5">\n                    {bookingHoursNotice}\n                  </p>\n                </FormSection>\n\n                <section className="box-border w-full max-w-full rounded-[12px] border border-[#f3e5ec] bg-white p-2.5 sm:rounded-[18px] sm:border-[var(--public-border)] sm:bg-[var(--public-soft-bg)] sm:p-3">',
                  'standard booking notice',
              ),
          ]

          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 target, got {count}")
              source = source.replace(old, new, 1)

          path.write_text(source)
          PY
          git diff --check
          git diff -- src/components/alyssa/PublicLeadForm.tsx
      - name: Commit notice patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/alyssa/PublicLeadForm.tsx
          git commit -m "Show booking-hours reminder on public forms [skip ci]"
          git push origin HEAD:agent/hk-public-holiday-booking-hours
