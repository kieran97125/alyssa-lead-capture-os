name: One-shot Creative Production Studio Bootstrap

on:
  push:
    branches:
      - feat/creative-production-studio-v1

permissions:
  contents: write

jobs:
  bootstrap-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      ALYSSA_E2E_FIXTURES: "1"
      E2E_ADMIN_PASSWORD: playwright-ci-password
      E2E_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/creative-production-studio-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Finalise source contracts
        run: |
          python3 scripts/creative-bootstrap-patch.py
          python3 scripts/creative-aftercare-patch.py
          python3 scripts/creative-import-dedup.py

      - name: Install focused rich Brief dependencies
        run: >-
          npm install --save-exact
          @tiptap/react
          @tiptap/starter-kit
          @tiptap/extension-image
          @tiptap/extension-link
          @tiptap/extension-task-list
          @tiptap/extension-task-item
          @tiptap/extension-placeholder
          @tiptap/extension-file-handler
          @tiptap/extension-underline

      - name: Verify production build and architecture contracts
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Creative Production Studio UI
        run: npm run test:creative

      - name: Verify full application regression
        run: npm run test:e2e

      - name: Commit verified Creative Production Studio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git status --short
          git commit -m "Complete Creative Production Studio v1"
          git push origin HEAD:feat/creative-production-studio-v1
