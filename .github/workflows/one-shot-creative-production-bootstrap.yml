name: One-shot Creative Production Studio Bootstrap

on:
  push:
    branches:
      - feat/creative-production-studio-v1

permissions:
  contents: write

jobs:
  bootstrap-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      ALYSSA_E2E_FIXTURES: "1"
      E2E_ADMIN_PASSWORD: playwright-ci-password
      E2E_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/creative-production-studio-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Finalise permissions, navigation, notifications and source contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Workspace permission model: marketers/designers enabled; CS/viewer excluded.
          path = Path("src/lib/security/workspacePermissions.ts")
          text = path.read_text(encoding="utf-8")
          if '"creative_jobs"' not in text:
              text = text.replace('  "calendar",\n', '  "calendar",\n  "creative_jobs",\n', 1)
              text = text.replace(
                  '    "calendar",\n    "launchhub",',
                  '    "calendar",\n    "creative_jobs",\n    "launchhub",',
                  3,
              )
              text = text.replace(
                  '  designer: ["dashboard", "calendar", "launchhub"],',
                  '  designer: ["dashboard", "calendar", "creative_jobs", "launchhub"],',
                  1,
              )
              text = text.replace(
                  '  if (pathname.startsWith("/tasks")) return "calendar";\n',
                  '  if (pathname.startsWith("/tasks")) return "calendar";\n  if (\n    pathname.startsWith("/creative-jobs") ||\n    pathname.startsWith("/api/creative-jobs")\n  ) return "creative_jobs";\n',
                  1,
              )
              path.write_text(text, encoding="utf-8")

          # Internal module union.
          path = Path("src/lib/security/internalAccess.ts")
          text = path.read_text(encoding="utf-8")
          if '| "creative_jobs"' not in text:
              text = text.replace(
                  '  | "calendar"\n',
                  '  | "calendar"\n  | "creative_jobs"\n',
                  1,
              )
              path.write_text(text, encoding="utf-8")

          # Left navigation: dedicated work collaboration group and notification badge.
          path = Path("src/components/alyssa/AppNavClient.tsx")
          text = path.read_text(encoding="utf-8")
          if "Palette," not in text:
              text = text.replace('  MessageCircleMore,\n', '  MessageCircleMore,\n  Palette,\n', 1)
          old_items = '''      { href: "/dashboard", label: "Dashboard", icon: Home, module: "dashboard" },
                { href: "/kpis", label: "品牌 KPI", icon: CircleGauge, module: "kpis" },
                { href: "/calendar", label: "營銷日曆", icon: CalendarDays, module: "calendar" },
                { href: "/tasks", label: "工作事項", icon: ListTodo, module: "calendar" },
          '''
          if old_items in text:
              new_items = '''      { href: "/dashboard", label: "Dashboard", icon: Home, module: "dashboard" },
                { href: "/kpis", label: "品牌 KPI", icon: CircleGauge, module: "kpis" },
          '''
              text = text.replace(old_items, new_items, 1)
          elif 'label: "工作協作"' not in text:
              text = text.replace(
                  '      { href: "/kpis", label: "品牌 KPI", icon: CircleGauge, module: "kpis" },\n      { href: "/calendar", label: "營銷日曆", icon: CalendarDays, module: "calendar" },\n      { href: "/tasks", label: "工作事項", icon: ListTodo, module: "calendar" },\n',
                  '      { href: "/kpis", label: "品牌 KPI", icon: CircleGauge, module: "kpis" },\n',
                  1,
              )
          if 'label: "工作協作"' not in text:
              marker = '''  {
    label: "客戶營運",
'''
              group = '''  {
    label: "工作協作",
    items: [
      { href: "/calendar", label: "營銷日曆", icon: CalendarDays, module: "calendar" },
      { href: "/tasks", label: "工作事項", icon: ListTodo, module: "calendar" },
      { href: "/creative-jobs", label: "設計工作", icon: Palette, module: "creative_jobs" },
    ],
  },
  {
    label: "客戶營運",
'''
              if marker not in text:
                  raise SystemExit("AppNavClient customer group marker missing")
              text = text.replace(marker, group, 1)
          if "creativeNotificationCount" not in text:
              text = text.replace(
                  '  workNotificationCount,\n}: {',
                  '  workNotificationCount,\n  creativeNotificationCount,\n}: {',
                  1,
              )
              text = text.replace(
                  '  workNotificationCount: number;\n}) {',
                  '  workNotificationCount: number;\n  creativeNotificationCount: number;\n}) {',
                  1,
              )
              text = text.replace(
                  '''        if (item.href === "/tasks" && workNotificationCount > 0) {
          return { ...item, badge: String(workNotificationCount) };
        }
        return item;
''',
                  '''        if (item.href === "/tasks" && workNotificationCount > 0) {
          return { ...item, badge: String(workNotificationCount) };
        }
        if (item.href === "/creative-jobs" && creativeNotificationCount > 0) {
          return { ...item, badge: String(creativeNotificationCount) };
        }
        return item;
''',
                  1,
              )
              text = text.replace(
                  '  workNotificationCount = 0,\n}: {',
                  '  workNotificationCount = 0,\n  creativeNotificationCount = 0,\n}: {',
                  1,
              )
              text = text.replace(
                  '  workNotificationCount?: number;\n}) {',
                  '  workNotificationCount?: number;\n  creativeNotificationCount?: number;\n}) {',
                  1,
              )
              text = text.replace(
                  '          workNotificationCount={workNotificationCount}\n',
                  '          workNotificationCount={workNotificationCount}\n          creativeNotificationCount={creativeNotificationCount}\n',
                  1,
              )
          path.write_text(text, encoding="utf-8")

          # Server navigation badge count.
          path = Path("src/components/alyssa/AppNav.tsx")
          text = path.read_text(encoding="utf-8")
          if "getUnreadCreativeNotificationCount" not in text:
              text = text.replace(
                  'import { getUnreadWorkNotificationCount } from "@/lib/marketing/workTasks";\n',
                  'import { getUnreadWorkNotificationCount } from "@/lib/marketing/workTasks";\nimport { getUnreadCreativeNotificationCount } from "@/lib/creative/store";\n',
                  1,
              )
              text = text.replace(
                  '  workNotificationCount: providedWorkNotificationCount,\n}: {',
                  '  workNotificationCount: providedWorkNotificationCount,\n  creativeNotificationCount: providedCreativeNotificationCount,\n}: {',
                  1,
              )
              text = text.replace(
                  '  workNotificationCount?: number;\n} = {}) {',
                  '  workNotificationCount?: number;\n  creativeNotificationCount?: number;\n} = {}) {',
                  1,
              )
              text = text.replace(
                  '''  const canSeeCalendar =
    isMaster ||
    access.source !== "supabase_auth" ||
    hasWorkspaceModulePermission(permissionContext, "calendar");
''',
                  '''  const canSeeCalendar =
    isMaster ||
    access.source !== "supabase_auth" ||
    hasWorkspaceModulePermission(permissionContext, "calendar");
  const canSeeCreative =
    isMaster ||
    access.source !== "supabase_auth" ||
    hasWorkspaceModulePermission(permissionContext, "creative_jobs");
''',
                  1,
              )
              text = text.replace(
                  '  const [leadAuditAlertCount, workNotificationCount] = await Promise.all([',
                  '  const [leadAuditAlertCount, workNotificationCount, creativeNotificationCount] = await Promise.all([',
                  1,
              )
              text = text.replace(
                  '''    providedWorkNotificationCount ??
      (canSeeCalendar ? getUnreadWorkNotificationCount() : 0),
  ]);
''',
                  '''    providedWorkNotificationCount ??
      (canSeeCalendar ? getUnreadWorkNotificationCount() : 0),
    providedCreativeNotificationCount ??
      (canSeeCreative ? getUnreadCreativeNotificationCount() : 0),
  ]);
''',
                  1,
              )
              text = text.replace(
                  '      workNotificationCount={workNotificationCount}\n',
                  '      workNotificationCount={workNotificationCount}\n      creativeNotificationCount={creativeNotificationCount}\n',
                  1,
              )
              path.write_text(text, encoding="utf-8")

          # Team settings toggle.
          path = Path("src/app/settings/team/page.tsx")
          text = path.read_text(encoding="utf-8")
          if '["creative_jobs", "設計工作"]' not in text:
              text = text.replace(
                  '  ["calendar", "營銷日曆"],\n',
                  '  ["calendar", "營銷日曆"],\n  ["creative_jobs", "設計工作"],\n',
                  1,
              )
              path.write_text(text, encoding="utf-8")

          # Creative actions: allow operations roles to create and seed a useful rich Brief.
          path = Path("src/app/creative-jobs/actions.ts")
          text = path.read_text(encoding="utf-8")
          if "isCreativeOperationsRole," not in text:
              text = text.replace(
                  '  isCreativeDesignerRole,\n',
                  '  isCreativeDesignerRole,\n  isCreativeOperationsRole,\n',
                  1,
              )
          text = text.replace(
              '  if (!canEditCreativeJobMetadata(access, { brandId: "" })) {',
              '  if (!isCreativeOperationsRole(access)) {',
              1,
          )
          if "Campaign 目的" not in text.split("export async function updateCreativeJobAction", 1)[0]:
              text = text.replace(
                  '''      requester_email:
        access.email ||
        (access.accessLevel === "master" ? "master" : "shared_admin"),
''',
                  '''      requester_email:
        access.email ||
        (access.accessLevel === "master" ? "master" : "shared_admin"),
      brief_document: {
        type: "doc",
        content: [
          { type: "heading", attrs: { level: 2 }, content: [{ type: "text", text: "Campaign 目的" }] },
          { type: "paragraph", content: [{ type: "text", text: "寫低今次內容／廣告要解決嘅問題，同埋成功標準。" }] },
          { type: "heading", attrs: { level: 2 }, content: [{ type: "text", text: "Deliverables／輸出要求" }] },
          { type: "taskList", content: [{ type: "taskItem", attrs: { checked: false }, content: [{ type: "paragraph", content: [{ type: "text", text: "列明數量、尺寸、片長、平台、字幕、VO 同版本要求" }] }] }] },
          { type: "heading", attrs: { level: 2 }, content: [{ type: "text", text: "畫面及 Reference" }] },
          { type: "paragraph", content: [{ type: "text", text: "可直接 Ctrl + V 貼 Screenshot，或者由右邊素材庫插入圖片及 Google Drive 連結。" }] },
          { type: "heading", attrs: { level: 2 }, content: [{ type: "text", text: "必須遵守／不可出現" }] },
          { type: "bulletList", content: [{ type: "listItem", content: [{ type: "paragraph", content: [{ type: "text", text: "價錢、CTA、Logo、合規字眼及品牌要求" }] }] }] },
        ],
      },
      brief_plain_text: "Campaign 目的\\nDeliverables／輸出要求\\n畫面及 Reference\\n必須遵守／不可出現",
''',
                  1,
              )
          path.write_text(text, encoding="utf-8")

          # Version restore action lives separately to keep the main action module focused.
          path = Path("src/components/creative/CreativeJobStudio.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '  restoreCreativeBriefVersionAction,\n',
              '',
              1,
          )
          if 'from "@/app/creative-jobs/versionActions"' not in text:
              text = text.replace(
                  '} from "@/app/creative-jobs/actions";\n',
                  '} from "@/app/creative-jobs/actions";\nimport { restoreCreativeBriefVersionAction } from "@/app/creative-jobs/versionActions";\n',
                  1,
              )
          text = text.replace('  type FormEvent,\n', '', 1)
          path.write_text(text, encoding="utf-8")

          # Rich editor compatibility cleanup.
          path = Path("src/components/creative/CreativeBriefEditor.tsx")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '  useState,\n} from "react";',
              '  useState,\n  type ReactNode,\n} from "react";',
              1,
          )
          text = text.replace('        resize: false,\n', '', 1)
          text = text.replace('  children: React.ReactNode;', '  children: ReactNode;', 1)
          path.write_text(text, encoding="utf-8")

          # Page/test type hygiene and valid PostgREST filter.
          path = Path("src/app/creative-jobs/page.tsx")
          text = path.read_text(encoding="utf-8")
          if 'type ReactNode' not in text:
              text = text.replace(
                  'import Link from "next/link";\n',
                  'import Link from "next/link";\nimport type { ReactNode } from "react";\n',
                  1,
              )
          text = text.replace('children: React.ReactNode;', 'children: ReactNode;', 1)
          path.write_text(text, encoding="utf-8")

          path = Path("e2e/creative-production.spec.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'import { expect, test } from "@playwright/test";',
              'import { expect, test, type Page } from "@playwright/test";',
              1,
          )
          text = text.replace(
              'async function openFixture(page: Parameters<typeof test>[0] extends never ? never : any) {',
              'async function openFixture(page: Page) {',
              1,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("src/lib/creative/store.ts")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '.not("status", "in", \'("completed","cancelled")\');',
              '.not("status", "in", "(completed,cancelled)");',
              1,
          )
          path.write_text(text, encoding="utf-8")

          # Edge Push follows explicit Creative Job action URLs.
          path = Path("supabase/functions/marketing-web-push-dispatch/index.ts")
          text = path.read_text(encoding="utf-8")
          if "creative_job_id" not in text:
              text = text.replace(
                  '  calendar_item_id: string | null;\n};',
                  '  calendar_item_id: string | null;\n  creative_job_id: string | null;\n  action_url: string | null;\n};',
                  1,
              )
              text = text.replace(
                  '    "calendar_published",\n',
                  '    "calendar_published",\n    "creative_assigned",\n    "creative_priority_changed",\n    "creative_due_soon",\n    "creative_overdue",\n    "creative_revision",\n',
                  1,
              )
              text = text.replace(
                  '"id,notification_type,title,body,task_id,calendar_item_id"',
                  '"id,notification_type,title,body,task_id,calendar_item_id,creative_job_id,action_url"',
                  1,
              )
              text = text.replace(
                  '    let url = "/tasks";\n    if (notification.task_id) {',
                  '    let url = notification.action_url || "/tasks";\n    if (!notification.action_url && notification.task_id) {',
                  1,
              )
              text = text.replace(
                  '    } else if (notification.calendar_item_id) {',
                  '    } else if (!notification.action_url && notification.calendar_item_id) {',
                  1,
              )
              text = text.replace(
                  '      requireInteraction: notification.notification_type === "task_overdue",',
                  '      requireInteraction: ["task_overdue", "creative_overdue"].includes(notification.notification_type),',
                  1,
              )
              path.write_text(text, encoding="utf-8")

          # Database restore transaction: preserve current content, then restore selected version.
          path = Path("supabase/migrations/20260901020000_creative_production_studio.sql")
          text = path.read_text(encoding="utf-8")
          if "restore_creative_brief_version" not in text:
              marker = "create or replace function public.queue_creative_job_reminders()"
              function_sql = r'''
create or replace function public.restore_creative_brief_version(
  p_job_id uuid,
  p_source_version_id uuid,
  p_new_version_no integer,
  p_actor_member_id uuid,
  p_actor_email text
)
returns void
language plpgsql
security definer
set search_path = public, pg_temp
as $$
declare
  current_job public.creative_jobs%rowtype;
  source_version public.creative_job_brief_versions%rowtype;
begin
  select * into current_job
  from public.creative_jobs
  where id = p_job_id and deleted_at is null
  for update;
  if not found then
    raise exception using errcode = 'P0002', message = 'creative_job_not_found';
  end if;

  select * into source_version
  from public.creative_job_brief_versions
  where id = p_source_version_id and job_id = p_job_id;
  if not found then
    raise exception using errcode = 'P0002', message = 'creative_brief_version_not_found';
  end if;

  insert into public.creative_job_brief_versions (
    job_id, version_no, document, plain_text, reason,
    created_by_member_id, created_by_email
  ) values (
    p_job_id, p_new_version_no, current_job.brief_document,
    current_job.brief_plain_text, 'manual', p_actor_member_id, p_actor_email
  );

  update public.creative_jobs
  set brief_document = source_version.document,
      brief_plain_text = source_version.plain_text,
      updated_at = now()
  where id = p_job_id;

  insert into public.creative_job_brief_versions (
    job_id, version_no, document, plain_text, reason,
    created_by_member_id, created_by_email
  ) values (
    p_job_id, p_new_version_no + 1, source_version.document,
    source_version.plain_text, 'restore', p_actor_member_id, p_actor_email
  );
end;
$$;

revoke all on function public.restore_creative_brief_version(
  uuid, uuid, integer, uuid, text
) from public, anon, authenticated;
grant execute on function public.restore_creative_brief_version(
  uuid, uuid, integer, uuid, text
) to service_role;

'''
              if marker not in text:
                  raise SystemExit("Creative reminder function marker missing")
              text = text.replace(marker, function_sql + marker, 1)
              path.write_text(text, encoding="utf-8")

          # Build contract scripts.
          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          scripts = package.setdefault("scripts", {})
          scripts["verify:creative-production-contract"] = (
              "node scripts/verify-creative-production-contract.mjs"
          )
          scripts["test:creative"] = (
              "playwright test e2e/creative-production.spec.ts"
          )
          build = scripts.get("build", "")
          verify = "npm run verify:creative-production-contract"
          if verify not in build:
              build = build.replace(
                  "npm run verify:design-system-contract && next build",
                  "npm run verify:design-system-contract && " + verify + " && next build",
                  1,
              )
              if verify not in build:
                  raise SystemExit("Could not insert creative contract into build")
              scripts["build"] = build
          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Install focused rich Brief dependencies
        run: |
          npm install --save-exact \
            @tiptap/react \
            @tiptap/starter-kit \
            @tiptap/extension-image \
            @tiptap/extension-link \
            @tiptap/extension-task-list \
            @tiptap/extension-task-item \
            @tiptap/extension-placeholder \
            @tiptap/extension-file-handler \
            @tiptap/extension-underline

      - name: Verify production build and architecture contracts
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Creative Production Studio UI
        run: npm run test:creative

      - name: Verify full application regression
        run: npm run test:e2e

      - name: Commit verified Creative Production Studio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git status --short
          git commit -m "Complete Creative Production Studio v1"
          git push origin HEAD:feat/creative-production-studio-v1
