name: One-shot Creative Workspace Finalize

on:
  push:
    branches:
      - fix/creative-job-list-density-requester
    paths:
      - .github/workflows/one-shot-creative-workspace-finalize.yml

permissions:
  contents: write

concurrency:
  group: one-shot-creative-workspace-finalize
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: true
      ALYSSA_E2E_FIXTURES: 1
      E2E_ADMIN_PASSWORD: playwright-ci-password
      E2E_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/creative-job-list-density-requester
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply final Creative workspace implementation
        run: python3 scripts/implement-creative-workspace-finalize.py

      - name: Remove obsolete permanent asset-panel contract
        run: sed -i '/assert\.match(studio, \/插入 Workspace\//d' scripts/verify-creative-production-contract.mjs

      - name: Remove unnecessary colour-label rewrite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-creative-release-corrections.py")
          text = path.read_text(encoding="utf-8")
          start_marker = '\n\neditor_path = "src/components/creative/CreativeBriefEditor.tsx"'
          end_marker = '\n\nfixture_path = "src/components/creative/CreativeProductionFixture.tsx"'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          path.write_text(text[:start] + text[end:], encoding="utf-8")
          PY

      - name: Apply release corrections and stable draft handoff
        run: python3 scripts/apply-creative-release-corrections.py

      - name: Verify sticky toolbar at its actual scroll threshold
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("e2e/creative-production.spec.ts")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"^[ \t]*await page\.evaluate\(\(\) => window\.scrollBy\(0, 500\)\);\s*"
              r"^[ \t]*const toolbarBox = await toolbar\.boundingBox\(\);\s*"
              r"^[ \t]*expect\(toolbarBox\?\.y \?\? 999\)\.toBeLessThanOrEqual\(2\);",
              re.MULTILINE,
          )
          replacement = '''  await toolbar.evaluate((element) => {
            const target =
              element.getBoundingClientRect().top + window.scrollY + 180;
            window.scrollTo(0, target);
          });
          await expect
            .poll(async () => (await toolbar.boundingBox())?.y ?? 999)
            .toBeLessThanOrEqual(2);'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError(
                  f"sticky toolbar threshold: expected one regex match, found {count}"
              )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Install dependencies
        run: npm ci

      - name: Verify production build and contracts
        run: npm run build

      - name: Build Storybook
        run: npm run build:storybook

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Refresh deterministic Creative Production baselines
        run: npx playwright test e2e/creative-production.spec.ts --update-snapshots

      - name: Verify Creative Production interactions and workspace
        run: npx playwright test e2e/creative-production.spec.ts

      - name: Verify design quality
        run: npm run test:design

      - name: Verify full product regression
        run: npm run test:e2e

      - name: Commit verified implementation and remove one-shot files
        shell: bash
        run: |
          rm .github/workflows/one-shot-creative-workspace-finalize.yml
          rm scripts/implement-creative-workspace-finalize.py
          rm scripts/apply-creative-release-corrections.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git status --short
          git commit -m "Finalize Creative Job workspace and persistence"
          git push origin HEAD:fix/creative-job-list-density-requester
