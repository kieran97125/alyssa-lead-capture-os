name: One-shot Daily Overview Excel submit patch

on:
  push:
    branches:
      - agent/daily-overview-excel-export

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/daily-overview-excel-export
      - name: Make export use current filter controls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/performance/daily/page.tsx')
          text = path.read_text()

          old = '''  const returnPath = `/performance/daily?${returnParams.toString()}`;\n  const exportParams = new URLSearchParams({ month: snapshot.monthStart });\n  if (snapshot.selectedBrandScope) {\n    exportParams.set("brand", snapshot.selectedBrandScope);\n  }\n  const exportHref = `/api/internal/daily-overview/export?${exportParams.toString()}`;\n  const tableBrands ='''
          new = '''  const returnPath = `/performance/daily?${returnParams.toString()}`;\n  const tableBrands ='''
          assert text.count(old) == 1, 'export href block mismatch'
          text = text.replace(old, new)

          old = '''              <a\n                data-testid="daily-overview-excel-export"\n                href={exportHref}\n                className="command-primary-button"\n              >\n                <FileSpreadsheet size={15} />\n                匯出 Excel\n              </a>'''
          new = '''              <button\n                type="submit"\n                formAction="/api/internal/daily-overview/export"\n                data-testid="daily-overview-excel-export"\n                className="command-primary-button"\n              >\n                <FileSpreadsheet size={15} />\n                匯出 Excel\n              </button>'''
          assert text.count(old) == 1, 'export action block mismatch'
          text = text.replace(old, new)
          path.write_text(text)

          Path('.github/workflows/one-shot-daily-overview-excel-form-submit.yml').unlink()
          PY
          git diff --check
      - name: Commit filter-submit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/performance/daily/page.tsx .github/workflows/one-shot-daily-overview-excel-form-submit.yml
          git commit -m "Use current Daily Overview filters for Excel export [skip ci]"
          git push origin HEAD:agent/daily-overview-excel-export
