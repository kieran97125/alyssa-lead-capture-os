name: One-shot daily and cumulative trend mode

on:
  push:
    branches:
      - agent/trend-mode-toggle

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      CI: "true"
      E2E_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/trend-mode-toggle
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reassemble and apply product patch
        shell: bash
        run: |
          cat scripts/.trend_patch_part_00 \
              scripts/.trend_patch_part_01 \
              scripts/.trend_patch_part_02 \
              scripts/.trend_patch_part_03 \
              scripts/.trend_patch_part_04 \
              scripts/.trend_patch_part_05 \
              scripts/.trend_patch_part_06 \
              > scripts/apply_trend_mode_toggle.py
          python3 scripts/apply_trend_mode_toggle.py
          rm -f scripts/.trend_patch_part_00 \
                scripts/.trend_patch_part_01 \
                scripts/.trend_patch_part_02 \
                scripts/.trend_patch_part_03 \
                scripts/.trend_patch_part_04 \
                scripts/.trend_patch_part_05 \
                scripts/.trend_patch_part_06
          echo "Time-series chart components:"
          grep -RIl --include='*.tsx' 'LineChart' src | sort

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify trend mode acceptance
        run: npx playwright test e2e/connected-marketing-ops.spec.ts

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/components/command-center/TrendModeToggle.tsx \
            src/components/command-center/PeriodComparisonChart.tsx \
            src/components/command-center/TreatmentPerformanceTrendChart.tsx \
            src/components/command-center/TreatmentPerformanceTrendChartLazy.tsx \
            src/components/command-center/LeadDashboardTrendChartLazy.tsx \
            src/components/command-center/LeadDashboardPanel.tsx \
            src/lib/marketing/performanceTrend.ts \
            src/lib/marketing/periodComparisonMath.ts \
            src/lib/marketing/periodComparison.ts \
            src/app/performance/compare/page.tsx \
            src/app/performance/page.tsx \
            e2e/connected-marketing-ops.spec.ts \
            docs/product-learning/entries/2026-08-28-daily-cumulative-trend-toggle.md
          git add -u -- scripts
          git diff --cached --check
          git status --short
          git commit -m "Add daily and cumulative trend views"
          git push origin HEAD:agent/trend-mode-toggle
