name: Resource baseline recording (authoring only)
on:
  pull_request:
    branches: [main]
    paths: ["e2e/workbench-resources.spec.ts", ".github/workflows/record-resource-baselines.yml"]
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      ALYSSA_E2E_FIXTURES: "1"
      NEXT_PUBLIC_SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/workbench-resources.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resource-baseline-review
          path: |
            e2e/workbench-resources.spec.ts-snapshots/
            playwright-report/
            test-results/
          retention-days: 7
