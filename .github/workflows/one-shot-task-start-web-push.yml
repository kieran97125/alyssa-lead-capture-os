name: One-shot task Start Day and Web Push integration

on:
  push:
    branches:
      - agent/task-start-date-web-push
    paths:
      - .github/workflows/one-shot-task-start-web-push.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      CI: true
      E2E_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/task-start-date-web-push
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply integration patch
        run: python3 scripts/one-shot-task-start-web-push.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build
        run: npm run build

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/lib/marketing/workTasks.ts \
            src/app/tasks/actions.ts \
            src/app/calendar/actions.ts \
            src/app/calendar/page.tsx \
            package.json \
            e2e/connected-marketing-ops.spec.ts
          git rm -- \
            scripts/one-shot-task-start-web-push.py \
            .github/workflows/one-shot-task-start-web-push.yml
          git commit -m "Connect task Start Day, Due Day and desktop Web Push"
          git push origin HEAD:agent/task-start-date-web-push
