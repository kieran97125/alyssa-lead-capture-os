name: One-shot finalize Creative Job delete lifecycle

on:
  push:
    branches:
      - fix/creative-job-delete-discoverability

permissions:
  contents: write

jobs:
  finalize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CI: "true"
      ALYSSA_E2E_FIXTURES: "1"
      E2E_ADMIN_PASSWORD: playwright-ci-password
      E2E_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""

    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: fix/creative-job-delete-discoverability
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply completed delete lifecycle
        run: python3 scripts/finalize-creative-job-delete-lifecycle.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build and contracts
        run: npm run build

      - name: Build Storybook
        run: npm run build:storybook

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Creative Jobs interactions and visual states
        run: npm run test:creative

      - name: Verify Design Quality and accessibility
        run: npm run test:design

      - name: Verify full application regression
        run: npm run test:e2e

      - name: Remove one-shot files and commit verified release
        shell: bash
        run: |
          rm .github/workflows/one-shot-finalize-creative-delete-lifecycle.yml
          rm scripts/finalize-creative-job-delete-lifecycle.py
          python3 - <<'PY'
          from pathlib import Path

          for name in [
              "docs/design-system/decisions/ADR-002-system-confirmation-dialog.md",
              "docs/design-system/CHANGELOG.md",
              "docs/product-learning/entries/2026-09-01-creative-job-delete-notification-lifecycle.md",
          ]:
              path = Path(name)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git status --short
          git commit -m "Complete Creative Job delete and notification lifecycle"
          git push origin HEAD:fix/creative-job-delete-discoverability
