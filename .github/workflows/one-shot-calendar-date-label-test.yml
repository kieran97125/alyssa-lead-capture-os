name: One-shot precise Calendar date label test

on:
  push:
    branches:
      - agent/task-start-date-web-push
    paths:
      - .github/workflows/one-shot-calendar-date-label-test.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/task-start-date-web-push
          fetch-depth: 0

      - name: Patch Calendar test labels
        run: python3 scripts/one-shot-calendar-date-label-test.py

      - name: Commit precise assertions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- e2e/marketing-command-center.spec.ts
          git rm -- \
            scripts/one-shot-calendar-date-label-test.py \
            .github/workflows/one-shot-calendar-date-label-test.yml
          git commit -m "Assert Calendar Start and Due dates explicitly"
          git push origin HEAD:agent/task-start-date-web-push
