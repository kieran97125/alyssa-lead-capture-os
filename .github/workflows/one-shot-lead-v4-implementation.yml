name: One-shot Lead v4 Event Ledger

on:
  push:
    branches:
      - fix/lead-sheet-v3-book-event-date
    paths:
      - .github/workflows/one-shot-lead-v4-implementation.yml

permissions:
  contents: write

concurrency:
  group: one-shot-lead-v4-event-ledger
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: true
      ALYSSA_E2E_FIXTURES: 1
      E2E_ADMIN_PASSWORD: playwright-ci-password
      E2E_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/lead-sheet-v3-book-event-date
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Lead v4 event ledger
        run: python3 scripts/implement-lead-v4-event-ledger.py

      - name: Install dependencies
        run: npm ci

      - name: Verify production build and contracts
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify focused Lead v4 ownership
        run: >-
          npx playwright test
          e2e/google-sheets-lead-sync.spec.ts
          e2e/meta-lead-form-normalizer.spec.ts
          e2e/lead-sheet-book-event-date.spec.ts
          e2e/marketing-command-center.spec.ts

      - name: Refresh approved Dashboard visual baseline
        run: npm run test:design:update

      - name: Verify design and accessibility
        run: npm run test:design

      - name: Verify full product regression
        run: npm run test:e2e

      - name: Commit verified implementation and remove one-shot files
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-lead-v4-discovery.yml
          rm -f .github/workflows/one-shot-lead-v4-implementation.yml
          rm -f scripts/implement-lead-v4-event-ledger.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/lib/integrations/googleSheetsLeadTable.ts")
          path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git status --short
          git commit -m "Preserve immutable Lead funnel events across status changes"
          git push origin HEAD:fix/lead-sheet-v3-book-event-date

# retrigger-v4-cutover: 2026-09-10-hkt-whitespace-fix
