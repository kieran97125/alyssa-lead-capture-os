name: Source v1 test contract patch

on:
  push:
    branches:
      - agent/source-performance-v1
    paths:
      - .github/workflows/source-v1-test-contract-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/source-performance-v1
      - name: Update legacy Daily Overview acceptance contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/marketing-command-center.spec.ts')
          text = path.read_text()
          old = '''  await expect(page.getByLabel("廣告費類型")).toHaveValue("meta_whatsapp");
          await expect(page.getByLabel("廣告費類型").locator("option")).toHaveText([
            "Meta · WhatsApp",
            "Meta · Lead Form",
            "Meta · Website Form",
            "Google Ads",
          ]);
          await expect(page.getByText("舊資料 · 未分類", { exact: true }).first()).toBeVisible();
          await expect(page.getByText("總廣告費", { exact: true }).first()).toBeVisible();
          await expect(page.getByText("CPL", { exact: true }).first()).toBeVisible();
          await expect(page.getByText("CPA · Book", { exact: true }).first()).toBeVisible();
          await expect(page.getByText("CPA · Show", { exact: true }).first()).toBeVisible();
          await expect(page.getByText(/Lead Sheet · 轉化/)).toBeVisible();
          await expect(page.getByText("每日廣告費", { exact: true }).first()).toBeVisible();

          await page.getByLabel("廣告費類型").selectOption("meta_lead_form");
          await page.getByRole("button", { name: "載入日期及類型" }).click();
          await expect(page).toHaveURL(/spend_type=meta_lead_form/);
          await expect(page.getByLabel(/Alyssa.*Meta · Lead Form 廣告費/)).toBeVisible();
'''
          new = '''  const spendEditor = page.getByTestId("daily-brand-spend-editor");
          await expect(spendEditor).toBeVisible();
          await expect(spendEditor.getByText("按品牌一次過填晒每日廣告費")).toBeVisible();
          await expect(spendEditor.locator('select[name="entry_brand"]')).toBeVisible();
          await expect(spendEditor.locator('select[name="spend_type"]')).toHaveCount(0);
          await expect(spendEditor.locator('input[name="amount:meta_whatsapp"]')).toBeVisible();
          await expect(spendEditor.locator('input[name="amount:meta_lead_form"]')).toBeVisible();
          await expect(spendEditor.locator('input[name="amount:meta_website_form"]')).toBeVisible();
          await expect(spendEditor.locator('input[name="amount:google_ads"]')).toBeVisible();
          await expect(page.getByText("舊資料 · 未分類", { exact: true }).first()).toBeVisible();
          await expect(page.getByText("總廣告費", { exact: true }).first()).toBeVisible();
          await expect(page.getByText("CPL", { exact: true }).first()).toBeVisible();
          await expect(page.getByText("CPA · Book", { exact: true }).first()).toBeVisible();
          await expect(page.getByText("CPA · Show", { exact: true }).first()).toBeVisible();
          await expect(page.getByText(/Lead Sheet · 轉化/)).toBeVisible();
          await expect(page.getByText("每日廣告費", { exact: true }).first()).toBeVisible();
'''
          if old not in text:
              raise SystemExit('legacy acceptance block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit updated contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- e2e/marketing-command-center.spec.ts
          git commit -m "Update Daily Overview acceptance for brand-first Spend [skip ci]"
          git push origin HEAD:agent/source-performance-v1
