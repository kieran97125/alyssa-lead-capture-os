name: One-shot Lead Current-Stage Date Model

on:
  push:
    branches:
      - fix/lead-sheet-v3-book-event-date
    paths:
      - .github/workflows/one-shot-lead-stage-date-model.yml

permissions:
  contents: write

concurrency:
  group: one-shot-lead-current-stage-date
  cancel-in-progress: false

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: true
      ALYSSA_E2E_FIXTURES: 1
      E2E_ADMIN_PASSWORD: playwright-ci-password
      E2E_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_PASSWORD: playwright-ci-password
      LAUNCHHUB_MASTER_PASSWORD: playwright-ci-master-password
      LAUNCHHUB_ADMIN_SESSION_SECRET: playwright-ci-session-secret-at-least-32-characters
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/lead-sheet-v3-book-event-date
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Make implementation replacements robust
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/implement-lead-stage-date-model.py")
          text = path.read_text(encoding="utf-8")

          old = "parser, count = sort_pattern.subn(sort_helper, parser, count=1)"
          new = "parser, count = sort_pattern.subn(lambda match: match.group(1) + sort_helper[2:], parser, count=1)"
          if text.count(old) != 1:
              raise RuntimeError(f"escape-safe replacement anchor count: {text.count(old)}")
          text = text.replace(old, new, 1)

          start_marker = "# User-facing definitions"
          end_marker = "# Focused acceptance tests"
          start = text.index(start_marker)
          start = text.rfind("# -----------------------------------------------------------------------------", 0, start)
          end = text.rfind("# -----------------------------------------------------------------------------", 0, text.index(end_marker))
          text = (
              text[:start]
              + "# -----------------------------------------------------------------------------\n"
              + "# User-facing definitions are patched directly by the workflow.\n"
              + "# -----------------------------------------------------------------------------\n\n"
              + text[end:]
          )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply current-stage event-date model
        run: python3 scripts/implement-lead-stage-date-model.py

      - name: Update Dashboard definitions to current-stage model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/components/command-center/LeadDashboardPanel.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "同一品牌及電話只計一次；Lead 按首次查詢日，Book 按首次預約更新日；舊 Lead 維持原有日期。",
                  "同一品牌及電話只計一次；Lead 按 Created At；新 Lead 嘅 Book／Show／No Show 按最後更新日期＋目前跟進狀態。",
              ),
              (
                  'meta={`${formatPercent(snapshot.totals.bookRate)} · 按預約更新日`}',
                  'meta={`${formatPercent(snapshot.totals.bookRate)} · 已進入預約流程`}',
              ),
              (
                  "Lead 按同品牌同電話尾 8 位嘅首次查詢日期；新 Lead 嘅 Book 按「最後更新日期」鎖定首次預約日，\n            舊 Lead 冇該日期時繼續按首次查詢日。Show 按確認到店日期；No Show 同本月未 Show 按預約日期。\n            Book 包括已預約、已到店及 No Show；同期間 Book Rate 係事件流量比率，唔係固定 cohort。",
                  "Lead 按同品牌同電話尾 8 位嘅 Created At。新 Lead 以「最後更新日期＋目前跟進狀態」判斷：\n            已預約＝Book 未 Show、已完成／已到店＝Show、No Show＝當日 No Show、待跟進＝未 Book。\n            Book 仍包括已預約、Show 及 No Show；舊 Lead 保留原有日期口徑。同期間比率係營運事件流量比率，唔係固定 cohort。",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise RuntimeError(f"Dashboard definition anchor count: {text.count(old)} for {old[:50]}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Update legacy-status acceptance to C-column authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("e2e/marketing-command-center.spec.ts")
          text = path.read_text(encoding="utf-8")
          old = '''  expect(
            normalizeLeadSheetStatus({
              followStatus: "待跟進",
              status: "",
              showUp: "No Show",
            })
          ).toBe("no_show");'''
          new = '''  expect(
            normalizeLeadSheetStatus({
              followStatus: "待跟進",
              status: "",
              showUp: "No Show",
            })
          ).toBe("lead");
          expect(
            normalizeLeadSheetStatus({
              followStatus: "",
              status: "",
              showUp: "No Show",
            })
          ).toBe("no_show");'''
          if text.count(old) != 1:
              raise RuntimeError(f"legacy status assertion anchor count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify production build and contracts
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify focused Lead status-date ownership
        run: >-
          npx playwright test
          e2e/google-sheets-lead-sync.spec.ts
          e2e/meta-lead-form-normalizer.spec.ts
          e2e/lead-sheet-book-event-date.spec.ts
          e2e/marketing-command-center.spec.ts

      - name: Refresh approved Dashboard visual baseline
        run: npm run test:design:update

      - name: Verify design and accessibility
        run: npm run test:design

      - name: Verify full product regression
        run: npm run test:e2e

      - name: Commit verified implementation and remove one-shot files
        shell: bash
        run: |
          rm .github/workflows/one-shot-lead-stage-date-model.yml
          rm scripts/implement-lead-stage-date-model.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git status --short
          git commit -m "Use current Lead stage date for operational funnel events"
          git push origin HEAD:fix/lead-sheet-v3-book-event-date
