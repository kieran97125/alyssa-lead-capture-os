name: One-shot trend mode regression compatibility

on:
  push:
    branches:
      - agent/trend-mode-toggle

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/trend-mode-toggle
          fetch-depth: 0

      - name: Update approved acceptance wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("e2e/marketing-command-center.spec.ts")
          text = path.read_text(encoding="utf-8")

          old_chart = "/每日 Lead走勢；橙色圓點代表已連結嘅成效事件/"
          new_chart = "/Lead單日走勢；橙色圓點代表已連結嘅成效事件/"
          if text.count(old_chart) != 2:
              raise SystemExit(f"expected 2 old chart labels, found {text.count(old_chart)}")
          text = text.replace(old_chart, new_chart)

          old_heading = 'page.getByRole("heading", { name: "同期累積走勢", exact: true })'
          new_heading = 'page.getByRole("heading", { name: "同期走勢", exact: true })'
          if text.count(old_heading) != 1:
              raise SystemExit(f"expected 1 old heading, found {text.count(old_heading)}")
          text = text.replace(old_heading, new_heading)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit acceptance update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/marketing-command-center.spec.ts
          git diff --cached --check
          git commit -m "Align regression tests with trend mode labels"
          git push origin HEAD:agent/trend-mode-toggle
