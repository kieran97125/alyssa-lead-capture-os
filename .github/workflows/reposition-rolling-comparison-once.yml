name: Reposition rolling comparison once

on:
  push:
    branches:
      - agent/show-prior-values-in-comparisons
    paths:
      - .github/workflows/reposition-rolling-comparison-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/show-prior-values-in-comparisons
          fetch-depth: 0
      - name: Move rolling comparison below monthly KPI block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/app/performance/compare/page.tsx')
          source = page.read_text()

          replacements = [
              (
                  'import type { ComponentType } from "react";',
                  'import { Suspense, type ComponentType } from "react";',
                  'React Suspense import',
              ),
              (
                  'import { PeriodComparisonChartLazy } from "@/components/command-center/PeriodComparisonChartLazy";',
                  'import { PeriodComparisonChartLazy } from "@/components/command-center/PeriodComparisonChartLazy";\nimport { RollingSevenDayComparison } from "@/components/command-center/RollingSevenDayComparison";',
                  'rolling component import',
              ),
              (
                  '''          ) : null}\n\n          <section className="period-analysis-grid">''',
                  '''          ) : null}\n\n          <Suspense fallback={null}>\n            <RollingSevenDayComparison />\n          </Suspense>\n\n          <section className="period-analysis-grid">''',
                  'rolling placement after monthly KPI grid',
              ),
          ]
          for old, new, label in replacements:
              count = source.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 target, got {count}')
              source = source.replace(old, new, 1)
          page.write_text(source)

          layout = Path('src/app/performance/compare/layout.tsx')
          layout_source = layout.read_text()
          layout_replacements = [
              (
                  'import { Suspense, type ReactNode } from "react";\nimport { RollingSevenDayComparison } from "@/components/command-center/RollingSevenDayComparison";',
                  'import type { ReactNode } from "react";',
                  'layout imports',
              ),
              (
                  '''      <Suspense fallback={null}>\n        <RollingSevenDayComparison />\n      </Suspense>\n      {children}''',
                  '''      {children}''',
                  'remove rolling block from layout top',
              ),
          ]
          for old, new, label in layout_replacements:
              count = layout_source.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 target, got {count}')
              layout_source = layout_source.replace(old, new, 1)
          layout.write_text(layout_source)

          spec = Path('e2e/rolling-seven-day-comparison.spec.ts')
          tests = spec.read_text()
          old = '''  await expect(page.getByText("前 7 日", { exact: false }).first()).toBeVisible();\n\n  const result = await page.evaluate(async () => {'''
          new = '''  await expect(page.getByText("前 7 日", { exact: false }).first()).toBeVisible();\n\n  const layoutOrder = await page.evaluate(() => {\n    const filter = document.querySelector(".period-filter-panel");\n    const monthly = document.querySelector(".period-kpi-grid");\n    const rolling = document.querySelector(".rolling-compare-shell");\n    const analysis = document.querySelector(".period-analysis-grid");\n    if (!filter || !monthly || !rolling || !analysis) return null;\n    const position = (left: Element, right: Element) =>\n      left.compareDocumentPosition(right) & Node.DOCUMENT_POSITION_FOLLOWING;\n    return {\n      filterBeforeMonthly: Boolean(position(filter, monthly)),\n      monthlyBeforeRolling: Boolean(position(monthly, rolling)),\n      rollingBeforeAnalysis: Boolean(position(rolling, analysis)),\n    };\n  });\n  expect(layoutOrder).toEqual({\n    filterBeforeMonthly: true,\n    monthlyBeforeRolling: true,\n    rollingBeforeAnalysis: true,\n  });\n\n  const result = await page.evaluate(async () => {'''
          if tests.count(old) != 1:
              raise RuntimeError(f'rolling layout test target: expected 1, got {tests.count(old)}')
          spec.write_text(tests.replace(old, new, 1))
          PY
          git diff --check
          git diff -- src/app/performance/compare/page.tsx src/app/performance/compare/layout.tsx e2e/rolling-seven-day-comparison.spec.ts
      - name: Commit product update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/performance/compare/page.tsx src/app/performance/compare/layout.tsx e2e/rolling-seven-day-comparison.spec.ts
          git commit -m "Reposition rolling comparison below monthly KPIs [skip ci]"
          git push origin HEAD:agent/show-prior-values-in-comparisons
