name: One-shot connected ops final test contract patch
on:
  push:
    branches:
      - agent/connected-marketing-ops-v1
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/connected-marketing-ops-v1
      - name: Align final connected operations assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('e2e/marketing-command-center.spec.ts')
          text = p.read_text()

          old_count = 'await expect(navigation.getByRole("link")).toHaveCount(13);'
          if text.count(old_count) != 1:
              raise SystemExit(f'expected one 13-link dashboard assertion, found {text.count(old_count)}')
          text = text.replace(
              old_count,
              'await expect(navigation.getByRole("link")).toHaveCount(14);'
          )

          old_label = '1 個日曆操作'
          if text.count(old_label) != 1:
              raise SystemExit(f'expected one old event-dot label, found {text.count(old_label)}')
          text = text.replace(old_label, '1 個成效事件')

          p.write_text(text)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/one-shot-connected-ops-final-test-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- e2e/marketing-command-center.spec.ts .github/workflows/one-shot-connected-ops-final-test-contract.yml
          git commit -m "Align remaining connected operations regressions"
          git push origin HEAD:agent/connected-marketing-ops-v1
